name: Android CI Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Prepare Environment and Secrets
      run: |
        # Create .env file for secrets gradle plugin
        echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env
        
        # Prepare keystores if provided in secrets or repository
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          echo "Release keystore decoded successfully."
        fi
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > "${GITHUB_WORKSPACE}/debug.keystore" || true
        fi

    - name: Build APKs with Gradle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        CM_KEYSTORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        CM_KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        CM_KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
        STORE_PASSWORD: ${{ secrets.CM_KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.CM_KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.CM_KEY_PASSWORD }}
      run: |
        gradle assembleDebug --stacktrace
        gradle assembleRelease --stacktrace || echo "Release build completed or skipped if unsigned"

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: SchoolGrades-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: SchoolGrades-Release-APK
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

